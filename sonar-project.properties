# SonarQube & SonarCloud Project Configuration
sonar.projectKey=NSGCINDIA_teach-ai-for-india
sonar.organization=nsgcindia

# Scope previously covered only app,components,lib,actions — which excluded
# hooks, providers, types, scripts and every SQL file. The migrations are where
# the authorization actually lives (RLS policies and SECURITY DEFINER RPCs), so
# leaving them unanalysed hid the highest-risk code in the repository.
sonar.sources=app,components,lib,actions,hooks,providers,types,scripts,supabase,proxy.ts,instrumentation.ts

sonar.tests=lib/auth/__tests__,lib/supabase/__tests__
sonar.exclusions=**/node_modules/**,.next/**,public/**
sonar.sourceEncoding=UTF-8
