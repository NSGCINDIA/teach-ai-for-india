# SonarQube & SonarCloud Project Configuration
sonar.projectKey=NSGCINDIA_teach-ai-for-india
sonar.organization=nsgcindia

# Scope previously covered only app,components,lib,actions — which excluded
# hooks, providers, types, scripts and every SQL file. The migrations are where
# the authorization actually lives (RLS policies and SECURITY DEFINER RPCs), so
# leaving them unanalysed hid the highest-risk code in the repository.
sonar.sources=app,components,lib,actions,hooks,providers,types,scripts,supabase,proxy.ts,instrumentation.ts

sonar.tests=lib/auth/__tests__,lib/supabase/__tests__,lib/schools/__tests__,lib/security/__tests__,lib/email/__tests__,lib/volunteer-applications/__tests__
sonar.exclusions=**/node_modules/**,.next/**,public/**,coverage/**,**/__tests__/**
sonar.sourceEncoding=UTF-8

# Coverage comes from `pnpm test:coverage` (node --test, lcov), which the
# SonarQube workflow runs first. Only code that unit tests can actually reach is
# measured: pages, components, server actions, SQL, config and the data readers
# need a browser or a live Supabase project, so counting them would make the
# "coverage on new code" gate unreachable rather than meaningful.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=app/**,components/**,actions/**,hooks/**,providers/**,types/**,scripts/**,supabase/**,lib/data/**,proxy.ts,instrumentation.ts

# Migrations are append-only SQL: error messages and role names repeat by nature,
# and an applied migration cannot be edited to introduce constants.
sonar.issue.ignore.multicriteria=migrationLiterals
sonar.issue.ignore.multicriteria.migrationLiterals.ruleKey=plsql:S1192
sonar.issue.ignore.multicriteria.migrationLiterals.resourceKey=supabase/migrations/**
